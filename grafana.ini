[server]
# Para habilitar HTTPS em produção, descomente as linhas abaixo e forneça os certificados
#protocol = https
#cert_file = /etc/grafana/certs/grafana.crt
#cert_key = /etc/grafana/certs/grafana.key

[security]
allow_embedding = false
admin_user = admin
# A senha do admin é definida exclusivamente via variável de ambiente GF_SECURITY_ADMIN_PASSWORD
# Não defina admin_password aqui — o grafana.ini não interpola variáveis de ambiente

# Habilite cookie_secure apenas quando HTTPS estiver ativo; com HTTP causa falha de sessão
# cookie_secure = true
cookie_samesite = strict

x_content_type_options = true

[auth]
disable_login_form = false
disable_signout_menu = false
